<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Management Dashboard</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <!-- LOGIN PAGE -->
    <div id="loginPage" class="login-container">
        <div class="login-wrapper">
            <div class="login-card glass-effect">
                <div class="login-header">
                    <div class="login-logo">
                        <h1>Bank<span>Manager</span></h1>
                    </div>
                    <p class="login-subtitle">Masuk ke dashboard manajemen data bank</p>
                </div>
                
                <form id="loginForm" class="login-form">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" placeholder="Masukkan username" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Masukkan password" required>
                    </div>
                    
                    <div class="form-options">
                        <label class="checkbox-label">
                            <input type="checkbox" id="rememberMe">
                            <span class="checkmark"></span>
                            Ingat saya
                        </label>
                    </div>
                    
                    <button type="submit" class="btn-primary btn-full">Masuk</button>
                </form>
            </div>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboardPage" style="display: none;">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <span>Bank<span class="highlight">Manager</span></span>
                </div>
                <button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>
            </div>
            
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" data-page="dashboard">
                    <span>📊 Dashboard</span>
                </a>
                <a href="#" class="nav-item" data-page="data">
                    <span>📁 Data Bank</span>
                </a>
                <div class="nav-divider"></div>
                <a href="#" class="nav-item logout" onclick="logout()">
                    <span>🚪 Logout</span>
                </a>
            </nav>
            
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="avatar" id="userAvatar">L</div>
                    <div class="user-details">
                        <span class="user-name" id="userName">Leader</span>
                        <span class="user-role" id="userRole">Administrator</span>
                    </div>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
                    <h2 class="page-title" id="pageTitle">Dashboard</h2>
                </div>
                <div class="topbar-right">
                    <div class="search-wrapper">
                        <input type="text" id="globalSearch" placeholder="Cari data..." class="search-input">
                    </div>
                </div>
            </header>

            <div class="content">
                <div id="page-dashboard" class="page-content active">
                    <div class="stats-grid" id="statsGrid"></div>
                    <div class="charts-grid">
                        <div class="chart-card glass-effect">
                            <h3>Data per Bank</h3>
                            <canvas id="bankChart"></canvas>
                        </div>
                        <div class="chart-card glass-effect">
                            <h3>Data per Status</h3>
                            <canvas id="statusChart"></canvas>
                        </div>
                    </div>
                </div>

                <div id="page-data" class="page-content">
                    <div class="table-container glass-effect">
                        <table id="dataTable">
                            <thead>
                                <tr>
                                    <th>No</th>
                                    <th>Bank</th>
                                    <th>Nama Rekening</th>
                                    <th>No Rekening</th>
                                    <th>Status</th>
                                    <th>Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="tableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
